version: "3.8"

services:
  mongo:
    image: mongo:7
    container_name: sptts-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: sptts
      MONGO_INITDB_ROOT_PASSWORD: sptts
    ports:
      - "27017:27017"
    volumes:
      - sptts-mongo-data:/data/db

volumes:
  sptts-mongo-data:
